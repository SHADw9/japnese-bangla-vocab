<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minna no Nihongo - Japanese Bangla Vocabulary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .jp-font { font-family: 'Noto Sans JP', sans-serif; }
    .bn-font { font-family: 'Tiro Bangla', serif; }
    .perspective { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400 flex items-center gap-2">
          <span>みんなの日本語</span>
          <span class="text-sm bg-indigo-900/50 text-indigo-300 border border-indigo-700 px-2 py-0.5 rounded-md">Bangla</span>
        </h1>
        <p class="text-xs text-slate-400">Japanese to Bangla Vocabulary Portal</p>
      </div>

      <!-- Tabs -->
      <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
        <button id="btn-grid" onclick="switchView('grid')" class="px-4 py-1.5 text-sm rounded-md font-medium transition bg-indigo-600 text-white">Grid View</button>
        <button id="btn-flashcard" onclick="switchView('flashcard')" class="px-4 py-1.5 text-sm rounded-md font-medium text-slate-400 hover:text-white transition">Flashcards</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">

    <!-- Controls Bar -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row gap-4 justify-between items-center mb-6">
      <!-- Lesson Selector -->
      <div class="w-full sm:w-auto">
        <label for="lesson-select" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Select Lesson</label>
        <select id="lesson-select" onchange="filterData()" class="w-full sm:w-48 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          <option value="all">All Lessons</option>
        </select>
      </div>

      <!-- Search Input -->
      <div class="w-full sm:w-72">
        <label for="search-input" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Search</label>
        <input type="text" id="search-input" oninput="filterData()" placeholder="Kanji, Kana, Romaji, Bangla..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
      </div>
    </div>

    <!-- JSON File Selector / Status -->
    <div id="file-status" class="hidden mb-6 p-4 bg-amber-900/30 border border-amber-700/50 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="text-sm text-amber-200">
        <strong>Auto-load failed:</strong> Please upload your generated <code>minna_nihongo_bangla.json</code> file.
      </div>
      <input type="file" id="json-file-input" accept=".json" onchange="handleFileUpload(event)" class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
    </div>

    <!-- Grid View -->
    <div id="view-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Word cards will render here -->
    </div>

    <!-- Flashcard View -->
    <div id="view-flashcard" class="hidden max-w-lg mx-auto py-8">
      <div class="perspective h-72 w-full cursor-pointer" onclick="flipCard()">
        <div id="card-inner" class="transform-style-3d transition-transform duration-500 relative w-full h-full bg-slate-800 border border-slate-700 rounded-2xl shadow-xl flex flex-col justify-between p-6">
          
          <!-- Front Side -->
          <div class="backface-hidden absolute inset-0 p-6 flex flex-col justify-between items-center text-center">
            <span id="fc-lesson" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">Lesson</span>
            <div>
              <div id="fc-kanji" class="text-4xl font-bold text-indigo-400 mb-2 jp-font"> Kanji </div>
              <div id="fc-kana" class="text-xl text-slate-300 jp-font"> Kana </div>
              <div id="fc-romaji" class="text-sm text-slate-400 italic mt-1"> Romaji </div>
            </div>
            <span class="text-xs text-slate-500">Click to flip</span>
          </div>

          <!-- Back Side -->
          <div class="backface-hidden rotate-y-180 absolute inset-0 p-6 flex flex-col justify-between items-center text-center bg-slate-800 rounded-2xl">
            <span class="text-xs bg-emerald-900/50 text-emerald-300 border border-emerald-700 px-2.5 py-1 rounded-full">Meaning</span>
            <div>
              <div id="fc-bangla" class="text-3xl font-bold text-emerald-400 mb-3 bn-font"> বাংলা অর্থ </div>
              <div id="fc-english" class="text-sm text-slate-400"> English Meaning </div>
            </div>
            <span class="text-xs text-slate-500">Click to flip</span>
          </div>

        </div>
      </div>

      <!-- Flashcard Navigation -->
      <div class="flex justify-between items-center mt-6">
        <button onclick="prevCard()" class="px-4 py-2 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-medium transition">← Previous</button>
        <span id="fc-counter" class="text-sm text-slate-400">0 / 0</span>
        <button onclick="nextCard()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition">Next →</button>
      </div>
    </div>

  </main>

  <script>
    let rawData = {};
    let activeWords = [];
    let currentView = 'grid';
    let cardIndex = 0;
    let isFlipped = false;

    // Fetch JSON automatically on load
    window.addEventListener('DOMContentLoaded', () => {
      fetch('minna_nihongo_bangla.json')
        .then(res => {
          if (!res.ok) throw new Error("File not found");
          return res.json();
        })
        .then(data => processData(data))
        .catch(() => {
          document.getElementById('file-status').classList.remove('hidden');
        });
    });

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          document.getElementById('file-status').classList.add('hidden');
          processData(data);
        } catch (err) {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);
    }

    function processData(data) {
      rawData = data;
      populateLessons();
      filterData();
    }

    function populateLessons() {
      const select = document.getElementById('lesson-select');
      select.innerHTML = '<option value="all">All Lessons</option>';
      
      const lessons = dataKeys().sort();
      lessons.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = key.replace('lesson-', 'Lesson ');
        select.appendChild(opt);
      });
    }

    function dataKeys() {
      return Object.keys(rawData).filter(k => k.startsWith('lesson-'));
    }

    function filterData() {
      const selectedLesson = document.getElementById('lesson-select').value;
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      activeWords = [];

      const keysToScan = selectedLesson === 'all' ? dataKeys() : [selectedLesson];

      keysToScan.forEach(lessonKey => {
        const words = rawData[lessonKey] || [];
        words.forEach(w => {
          const kanji = w.kanji || '';
          const kana = w.kana || '';
          const romaji = w.romaji || '';
          const en = (w.meaning && w.meaning.en) ? w.meaning.en : '';
          const bn = (w.meaning && w.meaning.bn) ? w.meaning.bn : '';

          const match = kanji.toLowerCase().includes(query) ||
                        kana.toLowerCase().includes(query) ||
                        romaji.toLowerCase().includes(query) ||
                        en.toLowerCase().includes(query) ||
                        bn.toLowerCase().includes(query);

          if (match) {
            activeWords.push({ ...w, lesson: lessonKey.replace('lesson-', 'L') });
          }
        });
      });

      cardIndex = 0;
      renderGrid();
      renderFlashcard();
    }

    function renderGrid() {
      const grid = document.getElementById('view-grid');
      grid.innerHTML = '';

      if (activeWords.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No vocabulary items found.</div>`;
        return;
      }

      activeWords.forEach(w => {
        const bnMeaning = w.meaning?.bn || '-';
        const enMeaning = w.meaning?.en || '-';

        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700/70 p-4 rounded-xl flex flex-col justify-between gap-3 shadow-sm hover:border-slate-600 transition";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-1">
              <span class="text-xs font-semibold bg-slate-700 text-slate-300 px-2 py-0.5 rounded">${w.lesson}</span>
              ${w.kanji ? `<span class="text-xl font-bold text-indigo-400 jp-font">${w.kanji}</span>` : ''}
            </div>
            <div class="text-lg font-medium text-slate-200 jp-font">${w.kana}</div>
            <div class="text-xs text-slate-400 italic">${w.romaji}</div>
          </div>
          <div class="border-t border-slate-700/50 pt-2 mt-1">
            <div class="text-base font-semibold text-emerald-400 bn-font">${bnMeaning}</div>
            <div class="text-xs text-slate-400">${enMeaning}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderFlashcard() {
      if (activeWords.length === 0) {
        document.getElementById('fc-counter').textContent = '0 / 0';
        document.getElementById('fc-kanji').textContent = '-';
        document.getElementById('fc-kana').textContent = '-';
        document.getElementById('fc-romaji').textContent = '';
        document.getElementById('fc-bangla').textContent = 'No data';
        document.getElementById('fc-english').textContent = '';
        return;
      }

      const w = activeWords[cardIndex];
      resetFlip();

      document.getElementById('fc-counter').textContent = `${cardIndex + 1} / ${activeWords.length}`;
      document.getElementById('fc-lesson').textContent = w.lesson;
      document.getElementById('fc-kanji').textContent = w.kanji || w.kana;
      document.getElementById('fc-kana').textContent = w.kanji ? w.kana : '';
      document.getElementById('fc-romaji').textContent = w.romaji || '';
      document.getElementById('fc-bangla').textContent = w.meaning?.bn || '-';
      document.getElementById('fc-english').textContent = w.meaning?.en || '-';
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('view-grid').classList.toggle('hidden', view !== 'grid');
      document.getElementById('view-flashcard').classList.toggle('hidden', view !== 'flashcard');

      document.getElementById('btn-grid').className = view === 'grid' 
        ? 'px-4 py-1.5 text-sm rounded-md font-medium transition bg-indigo-600 text-white' 
        : 'px-4 py-1.5 text-sm rounded-md font-medium text-slate-400 hover:text-white transition';

      document.getElementById('btn-flashcard').className = view === 'flashcard' 
        ? 'px-4 py-1.5 text-sm rounded-md font-medium transition bg-indigo-600 text-white' 
        : 'px-4 py-1.5 text-sm rounded-md font-medium text-slate-400 hover:text-white transition';
    }

    function flipCard() {
      isFlipped = !isFlipped;
      document.getElementById('card-inner').classList.toggle('rotate-y-180', isFlipped);
    }

    function resetFlip() {
      isFlipped = false;
      document.getElementById('card-inner').classList.remove('rotate-y-180');
    }

    function nextCard() {
      if (activeWords.length === 0) return;
      cardIndex = (cardIndex + 1) % activeWords.length;
      renderFlashcard();
    }

    function prevCard() {
      if (activeWords.length === 0) return;
      cardIndex = (cardIndex - 1 + activeWords.length) % activeWords.length;
      renderFlashcard();
    }
  </script>
</body>
</html>
